name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pytest ruff
      - run: ruff check .
      - run: pytest -q
      - name: Seeded-flaw benchmark (rules)
        run: threatlens bench
      - name: Review the real systems
        run: |
          for f in examples/real/*.yml; do b=$(basename "$f" .yml)
            threatlens review "$f" --out "results/reviews/$b.md"
            threatlens review "$f" --format sarif --out "results/reviews/$b.sarif"
          done
      - run: python scripts/build_web.py
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: web/
  pages:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
