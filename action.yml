name: ThreatLens design review
description: Review architecture specs on every pull request and post findings to GitHub code scanning.
inputs:
  spec:
    description: Path to the architecture YAML
    required: true
  fail-on:
    description: Fail the check when an open finding is at or above this rating (low, medium, high, critical)
    default: high
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - shell: bash
      run: pip install "${{ github.action_path }}"
    - shell: bash
      run: threatlens review "${{ inputs.spec }}" --format sarif --out threatlens.sarif
    - uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: threatlens.sarif
        category: threatlens
    - shell: bash
      run: threatlens review "${{ inputs.spec }}" --format md --fail-on "${{ inputs.fail-on }}" | tee -a "$GITHUB_STEP_SUMMARY"
